<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Petting Dragoris...</title>
  <style>
    body { 
      font-family: sans-serif; 
      text-align: center; 
      background: #2f3136; 
      color: white; 
      padding-top: 50px; 
    }
    h1 { color: #5865f2; }
    .dragon-icon { cursor: pointer; user-select: none; }
    .name-box {
      margin-top: 20px;
      background: #36393f;
      display: inline-block;
      padding: 20px 30px;
      border-radius: 8px;
    }
    input {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #202225;
      background: #40444b;
      color: white;
      font-size: 14px;
    }
    button {
      padding: 10px 18px;
      border-radius: 4px;
      border: none;
      background: #5865f2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #4752c4; }
    .status-msg {
      color: #57f287;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
    #cooldown-timer {
      color: #faa81a;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1><span class="dragon-icon" ondblclick="secretResetPrompt()">🐉</span> You petted Dragoris!</h1>
  <p id="status">Checking pet status...</p>
  <p id="cooldown-timer"></p>

  <div class="name-box">
    <p id="box-title" style="margin-top: 0; font-weight: bold;">Enter your name to pet Dragoris:</p>
    <input type="text" id="username" placeholder="Your Name">
    <button id="action-btn" onclick="handleButtonClick()">Pet Dragoris!</button>
    <p id="saved-msg" class="status-msg"></p>
  </div>

  <script>
    // REPLACE WITH YOUR HOOKDECK / PROXY / WEBHOOK URL
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1552401405992771705/Z3LaLFWIZOwP3EW1SWaC3qW_1la64S9OtoMQwzLDu1tUxPgGHVdm8DIELmmFUBko-ayj";
    // SECRET PASSWORD TO RESET COUNTER (Change this to whatever you want!)
    const RESET_PASSWORD = "dragon123";

    const COUNTER_KEY = "dragoris-pets-99";
    let savedName = localStorage.getItem('dragoris_petter_name');
    let totalPets = "???";
    let timerInterval = null;

    checkCooldownAndExecute();

    function checkCooldownAndExecute() {
      const lastPetTime = localStorage.getItem('dragoris_last_pet_time');
      const now = Date.now();
      const cooldownTime = 30000; // 30 seconds

      if (lastPetTime && (now - lastPetTime < cooldownTime)) {
        // ON COOLDOWN: Read current count without incrementing (+1)
        fetchReadOnlyCounter();

        const remainingSeconds = Math.ceil((cooldownTime - (now - lastPetTime)) / 1000);
        startCooldownTimer(remainingSeconds);

        if (savedName) setupReturningUserUI();
        else setupNewUserUI();
      } else {
        // NOT ON COOLDOWN: Increment counter and send Discord notification
        processPetAction();
      }
    }

    // Read counter without incrementing
    function fetchReadOnlyCounter() {
      fetch(`https://countapi.mileshilliard.com/api/v1/get/${COUNTER_KEY}`)
        .then(res => res.json())
        .then(data => {
          totalPets = data.value;
          document.getElementById('status').innerText = `Dragoris has been petted ${totalPets} times!`;
        })
        .catch(() => {
          document.getElementById('status').innerText = "Dragoris loved the pets!";
        });
    }

    // Core function to hit counter (+1) and notify Discord
    function processPetAction() {
      localStorage.setItem('dragoris_last_pet_time', Date.now());
      document.getElementById('cooldown-timer').innerText = "";

      fetch(`https://countapi.mileshilliard.com/api/v1/hit/${COUNTER_KEY}`)
        .then(res => res.json())
        .then(data => {
          totalPets = data.value;
          document.getElementById('status').innerText = `Dragoris has now been petted ${totalPets} times!`;

          if (savedName) {
            setupReturningUserUI();
            sendDiscordNotification(savedName, totalPets);
          } else {
            setupNewUserUI();
          }

          startCooldownTimer(30);
        })
        .catch(err => {
          console.error("Counter API error:", err);
          document.getElementById('status').innerText = "Dragoris loved the pets!";
          if (savedName) sendDiscordNotification(savedName, "Unknown");
          startCooldownTimer(30);
        });
    }

    // Live Cooldown Timer (Stops at 0 without auto-restarting)
    function startCooldownTimer(seconds) {
      clearInterval(timerInterval);
      let timeLeft = seconds;
      const timerDisplay = document.getElementById('cooldown-timer');

      timerDisplay.innerText = `⏳ Please wait ${timeLeft}s before petting again...`;

      timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          timerDisplay.innerText = `⏳ Please wait ${timeLeft}s before petting again...`;
        } else {
          clearInterval(timerInterval);
          timerDisplay.innerText = "✨ Ready to pet again! (Refresh or click below)";
        }
      }, 1000);
    }

    // SECRET RESET METHOD: Double-click 🐉 to trigger
    function secretResetPrompt() {
      const pass = prompt("🔐 Enter Secret Reset Password:");
      if (pass === RESET_PASSWORD) {
        // Reset counter on server
        fetch(`https://countapi.mileshilliard.com/api/v1/set/${COUNTER_KEY}?value=0`)
          .then(res => res.json())
          .then(() => {
            alert("Counter has been reset to 0!");
            localStorage.removeItem('dragoris_last_pet_time');
            
            // Send reset notification to Discord
            if (WEBHOOK_URL && !WEBHOOK_URL.includes("YOUR_WEBHOOK")) {
              fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  content: `⚠️ **Dragoris pet count was reset to 0 by ${savedName || "Admin"}!**`
                })
              });
            }
            location.reload();
          });
      } else if (pass !== null) {
        alert("Incorrect password!");
      }
    }

    // Helper: Send Webhook
    function sendDiscordNotification(nameToSend, count) {
      if (!WEBHOOK_URL || WEBHOOK_URL.includes("YOUR_WEBHOOK")) return;

      fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: `🐉 **${nameToSend}** petted Dragoris! Total pets: **${count}**`
        })
      });
    }

    // UI Setup Functions
    function setupReturningUserUI() {
      document.getElementById('box-title').innerText = `Petting as: ${savedName}`;
      document.getElementById('username').value = savedName;
      document.getElementById('action-btn').innerText = "Update Name";
    }

    function setupNewUserUI() {
      document.getElementById('box-title').innerText = "What's your name?";
      document.getElementById('action-btn').innerText = "Save & Send Pet!";
    }

    // Button Handler
    function handleButtonClick() {
      const inputVal = document.getElementById('username').value.trim();
      const newName = inputVal !== "" ? inputVal : "Anonymous";

      const isFirstTime = !savedName;
      savedName = newName;
      localStorage.setItem('dragoris_petter_name', savedName);

      const msg = document.getElementById('saved-msg');

      if (isFirstTime) {
        const lastPetTime = localStorage.getItem('dragoris_last_pet_time');
        const now = Date.now();
        if (!lastPetTime || (now - lastPetTime >= 30000)) {
          processPetAction();
        } else {
          sendDiscordNotification(savedName, totalPets);
        }
        msg.innerText = "Name saved & pet sent!";
        setupReturningUserUI();
      } else {
        msg.innerText = "Name updated for next pet!";
        document.getElementById('box-title').innerText = `Petting as: ${savedName}`;
      }

      msg.style.display = "block";
      setTimeout(() => { msg.style.display = "none"; }, 3000);
    }
  </script>
</body>
</html>
