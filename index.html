<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Petting Dragoris...</title>
  <style>
    body { 
      font-family: sans-serif; 
      text-align: center; 
      background: #2f3136; 
      color: white; 
      padding-top: 50px; 
    }
    h1 { color: #5865f2; }
    .name-box {
      margin-top: 20px;
      background: #36393f;
      display: inline-block;
      padding: 20px 30px;
      border-radius: 8px;
    }
    input {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #202225;
      background: #40444b;
      color: white;
      font-size: 14px;
    }
    button {
      padding: 10px 18px;
      border-radius: 4px;
      border: none;
      background: #5865f2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #4752c4; }
    button:disabled { background: #747f8d; cursor: not-allowed; }
    .status-msg {
      color: #57f287;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
    #cooldown-timer {
      color: #faa81a;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🐉 You petted Dragoris!</h1>
  <p id="status">Checking pet status...</p>
  <p id="cooldown-timer"></p>

  <div class="name-box">
    <p id="box-title" style="margin-top: 0; font-weight: bold;">Enter your name to pet Dragoris:</p>
    <input type="text" id="username" placeholder="Your Name">
    <button id="action-btn" onclick="handleButtonClick()">Pet Dragoris!</button>
    <p id="saved-msg" class="status-msg"></p>
  </div>

  <script>
    // REPLACE WITH YOUR HOOKDECK / PROXY / WEBHOOK URL
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1552401405992771705/Z3LaLFWIZOwP3EW1SWaC3qW_1la64S9OtoMQwzLDu1tUxPgGHVdm8DIELmmFUBko-ayj";

    let savedName = localStorage.getItem('dragoris_petter_name');
    let totalPets = "???";
    let timerInterval = null;

    // Check existing cooldown on load
    checkCooldownAndExecute();

    function checkCooldownAndExecute() {
      const lastPetTime = localStorage.getItem('dragoris_last_pet_time');
      const now = Date.now();
      const cooldownTime = 30000; // 30 seconds

      if (lastPetTime && (now - lastPetTime < cooldownTime)) {
        // COOLDOWN ACTIVE: Start live timer, DO NOT increment counter or send webhook yet
        const remainingSeconds = Math.ceil((cooldownTime - (now - lastPetTime)) / 1000);
        startCooldownTimer(remainingSeconds);
        
        if (savedName) setupReturningUserUI();
        else setupNewUserUI();
      } else {
        // NO COOLDOWN: Process pet action immediately
        processPetAction();
      }
    }

    // Core function to hit counter and notify Discord
    function processPetAction() {
      localStorage.setItem('dragoris_last_pet_time', Date.now());
      document.getElementById('cooldown-timer').innerText = "";

      // 1. Fetch & Increment Counter API
      fetch('https://countapi.mileshilliard.com/api/v1/hit/dragoris-pets-99')
        .then(res => res.json())
        .then(data => {
          totalPets = data.value;
          document.getElementById('status').innerText = `Dragoris has now been petted ${totalPets} times!`;
          
          // 2. Decide flow for notifications
          if (savedName) {
            setupReturningUserUI();
            sendDiscordNotification(savedName, totalPets);
          } else {
            setupNewUserUI();
          }

          // 3. Start cooldown timer after execution
          startCooldownTimer(30);
        })
        .catch(err => {
          console.error("Counter API error:", err);
          document.getElementById('status').innerText = "Dragoris loved the pets!";
          if (savedName) sendDiscordNotification(savedName, "Unknown");
          startCooldownTimer(30);
        });
    }

    // Helper: Send Webhook to Discord
    function sendDiscordNotification(nameToSend, count) {
      if (!WEBHOOK_URL || WEBHOOK_URL.includes("YOUR_WEBHOOK")) {
        console.error("Webhook URL is not configured properly.");
        return;
      }

      fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: `🐉 **${nameToSend}** petted Dragoris! Total pets: **${count}**`
        })
      })
      .then(res => {
        if (!res.ok) console.error(`Webhook error status ${res.status}`);
        else console.log("Webhook delivered successfully!");
      })
      .catch(err => console.error("Webhook Fetch Error:", err));
    }

    // Live Cooldown Timer Handler
    function startCooldownTimer(seconds) {
      clearInterval(timerInterval);
      let timeLeft = seconds;
      const timerDisplay = document.getElementById('cooldown-timer');

      timerDisplay.innerText = `⏳ Please wait ${timeLeft}s before petting again...`;

      timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          timerDisplay.innerText = `⏳ Please wait ${timeLeft}s before petting again...`;
        } else {
          clearInterval(timerInterval);
          timerDisplay.innerText = "";
          // Automatically run pet action when timer ends
          processPetAction();
        }
      }, 1000);
    }

    // UI Setup Functions
    function setupReturningUserUI() {
      document.getElementById('box-title').innerText = `Petting as: ${savedName}`;
      document.getElementById('username').value = savedName;
      document.getElementById('action-btn').innerText = "Update Name";
    }

    function setupNewUserUI() {
      document.getElementById('box-title').innerText = "What's your name?";
      document.getElementById('action-btn').innerText = "Save & Send Pet!";
    }

    // Button Action Handler
    function handleButtonClick() {
      const inputVal = document.getElementById('username').value.trim();
      const newName = inputVal !== "" ? inputVal : "Anonymous";
      
      const isFirstTime = !savedName;
      savedName = newName;
      localStorage.setItem('dragoris_petter_name', savedName);

      const msg = document.getElementById('saved-msg');

      if (isFirstTime) {
        // First time submission: Process immediately if not on cooldown
        const lastPetTime = localStorage.getItem('dragoris_last_pet_time');
        const now = Date.now();
        if (!lastPetTime || (now - lastPetTime >= 30000)) {
          processPetAction();
        } else {
          sendDiscordNotification(savedName, totalPets);
        }
        msg.innerText = "Name saved & pet sent!";
        setupReturningUserUI();
      } else {
        msg.innerText = "Name updated for next pet!";
        document.getElementById('box-title').innerText = `Petting as: ${savedName}`;
      }

      msg.style.display = "block";
      setTimeout(() => { msg.style.display = "none"; }, 3000);
    }
  </script>
</body>
</html>
